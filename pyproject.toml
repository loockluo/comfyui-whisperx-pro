[project]
name = "whisperx-pro"
description = "A professional ComfyUI custom node for accurate text-audio alignment using [a/WhisperX](https://github.com/m-bain/whisperX)."
version = "1.0.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["# WhisperX and dependencies", "git+https://github.com/m-bain/whisperx.git", "# Core dependencies (usually installed with WhisperX)", "torch>=2.0.0", "torchaudio>=2.0.0", "transformers>=4.30.0", "faster-whisper>=0.9.0", "# Audio processing", "librosa>=0.10.0", "soundfile>=0.12.0", "# Alignment models", "ctc-segmentation>=1.7.0"]

[project.urls]
Repository = "https://github.com/loockluo/comfyui-whisperx-pro"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/loockluo/comfyui-whisperx-pro/wiki"
"Bug Tracker" = "https://github.com/loockluo/comfyui-whisperx-pro/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "comfyui-whisperx-pro"
Icon = ""
includes = [] 
# "requires-comfyui" = ">=1.0.0"  # ComfyUI version compatibility

